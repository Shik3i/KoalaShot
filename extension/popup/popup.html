<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KoalaShot</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="../common/footer.css">
  </head>
  <body data-phase="idle">
    <main class="popup-shell">
      <header class="brand-row"><img src="../icons/icon-32.png" alt="" width="32" height="32"><div><p class="eyebrow">KoalaShot</p><h1>Full-page screenshot</h1></div></header>
      <section class="action-card" aria-label="Capture this page">
        <label class="field-label" for="capture-target">Capture area</label>
        <select id="capture-target" class="select-control" disabled><option value="page">Full page</option><option value="internal">Scrollable area inside the page</option></select>
        <p id="settings-status" class="settings-status" role="status"></p>
        <div id="capture-actions" class="button-stack">
          <button id="edit-button" class="button button-primary" type="button" disabled>Capture &amp; edit</button>
          <div class="action-pair"><button id="copy-button" class="button button-secondary" type="button" disabled>Capture &amp; copy</button><button id="save-button" class="button button-secondary" type="button" disabled>Capture &amp; save</button></div>
          <p class="capture-help">Edit to crop or redact first. Copy and Save export the original.</p>
        </div>
      </section>
      <section id="result-card" class="result-card" aria-label="Completed capture" hidden>
        <div class="result-overview"><img id="capture-preview" alt="Preview of the completed capture"><div><strong id="result-label">Completed capture</strong><p id="result-meta"></p></div></div>
        <p id="capture-warning" class="capture-warning" role="status" hidden></p>
        <div class="result-actions"><button id="copy-result-button" class="button button-secondary" type="button">Copy original</button><button id="save-result-button" class="button button-secondary" type="button">Save original</button><button id="edit-result-button" class="button button-primary" type="button">Edit</button></div>
        <button id="capture-again-button" class="text-button" type="button">Capture again</button>
      </section>
      <section class="status-card" aria-label="Capture status">
        <p id="status" class="status-line" role="status" aria-live="polite">Ready.</p>
        <div id="progress-track" class="progress-track" hidden aria-hidden="true"><span id="progress-bar"></span></div>
        <button id="cancel-button" class="button button-cancel" type="button" hidden>Cancel capture</button>
        <p class="capture-help keep-open">Keep this popup open until capture finishes.</p>
      </section>
    </main>
    <footer class="product-footer" data-product-footer></footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
