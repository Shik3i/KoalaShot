<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lazy loaded fixture</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f5f8f5;color:#18301f}main{max-width:760px;margin:auto;padding:24px}.instructions{padding:14px;border:2px solid #287a4a;background:#e9f1ea}.lazy{min-height:380px;margin:18px 0;padding:24px;background:#fff;border:1px solid #cad8ce}.loaded{background:#dcefe0}</style></head><body><main><div class="instructions"><strong>Manual check:</strong> Scroll capture should trigger the deterministic local lazy blocks. A bounded warning is not expected for this fixture.</div><div class="lazy">Lazy block 1<section hidden>Loaded content 1</section></div><div class="lazy">Lazy block 2<section hidden>Loaded content 2</section></div><div class="lazy">Lazy block 3<section hidden>Loaded content 3</section></div><div class="lazy">Lazy block 4<section hidden>Loaded content 4</section></div><div class="lazy">Lazy block 5<section hidden>Loaded content 5</section></div></main><script>const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const block=entry.target;const content=block.querySelector('section');content.hidden=false;block.classList.add('loaded');observer.unobserve(block)}}),{rootMargin:'160px'});document.querySelectorAll('.lazy').forEach(block=>observer.observe(block));</script></body></html>
