<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Very tall page fixture</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f5f8f5;color:#18301f}main{max-width:760px;margin:auto;padding:24px}.instructions{padding:14px;border:2px solid #287a4a;background:#e9f1ea}.section{min-height:360px;margin:14px 0;padding:24px;background:#fff;border:1px solid #cad8ce}</style></head><body><main><div class="instructions"><strong>Manual check:</strong> This bounded tall fixture checks progress, overlap placement, memory handling, cancellation, and final page restoration. Capture should include every numbered section.</div><div id="sections"></div></main><script>const root=document.querySelector('#sections');for(let i=1;i<=30;i+=1){const section=document.createElement('section');section.className='section';section.textContent=`Very tall section ${i}`;root.append(section)}</script></body></html>
