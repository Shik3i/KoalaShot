<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynamic height fixture</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f5f8f5;color:#18301f}main{max-width:760px;margin:auto;padding:24px}.instructions{padding:14px;border:2px solid #287a4a;background:#e9f1ea}.block{min-height:460px;margin:18px 0;padding:24px;background:#fff;border:1px solid #cad8ce}</style></head><body><main><div class="instructions"><strong>Manual check:</strong> The page adds one bounded section when the scroll position first passes 900px. Capture should include it without following an infinite feed.</div><div class="block">Section 1</div><div class="block">Section 2</div><div class="block">Section 3</div><div class="block">Section 4</div></main><script>let added=false;addEventListener('scroll',()=>{if(!added&&scrollY>900){added=true;const block=document.createElement('div');block.className='block';block.textContent='Bounded dynamic section';document.querySelector('main').append(block)}},{passive:true});</script></body></html>
