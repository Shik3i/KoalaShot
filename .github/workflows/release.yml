name: Release KoalaShot

on:
  push:
    tags:
      - 'v*'

# The pushed tag is the immutable source of the release. Run
# npm run release:prepare -- X.Y.Z, merge the reviewed PR, then push its annotated tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      commit: ${{ steps.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # An explicit tag ref avoids checkout substituting github.sha for the tag object.
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require annotated tag, exact main and successful CI/CodeQL
        id: preflight
        run: node scripts/release-preflight.mjs

  browser-checks:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Set up Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: 151.0.7922.34
      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: 152.0.3
      - name: Install Node metadata
        run: npm ci
      - name: Build release archives
        run: npm run build
      - name: Run target-browser success and denial flows
        run: npm run test:browser:${{ matrix.browser }}
      - name: Run capture and redaction regressions
        if: matrix.browser == 'chrome'
        run: node tests/browser/audit-regressions.test.mjs
      - name: Verify website routes and store availability in Chrome
        if: matrix.browser == 'chrome'
        run: npm run test:website

  release-extension:
    needs: [preflight, browser-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Validate release tag and source versions
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          for file in package.json extension/manifests/chrome.json extension/manifests/firefox.json landing/version.json; do
            actual=$(jq -r '.version' "$file")
            if [[ "$actual" != "$VERSION" ]]; then
              echo "$file has version $actual, expected $VERSION" >&2
              exit 1
            fi
          done
          grep -Fq "export const VERSION = \"$VERSION\"" extension/common/constants.js
          grep -Fq "Current build: v$VERSION" README.md
          grep -Fq "koalashot-chrome-$VERSION.zip" README.md
          grep -Fq "koalashot-firefox-$VERSION.zip" README.md
          echo "Release source matches $GITHUB_REF_NAME."

      - name: Install dependencies
        run: npm ci

      - name: Run full release verification
        run: npm test

      - name: Recheck release eligibility before uploading
        run: node scripts/release-preflight.mjs

      - name: Generate and verify portable release checksums
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          node scripts/run-python.cjs scripts/release_assets.py dist "$VERSION" --write
          cat dist/SHA256SUMS

      - name: Generate extension artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/koalashot-*.zip

      - name: Upload landing page artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koalashot-landing-${{ github.ref_name }}
          path: dist/landing/
          if-no-files-found: error

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            dist/koalashot-chrome-${{ steps.version.outputs.VERSION }}.zip
            dist/koalashot-firefox-${{ steps.version.outputs.VERSION }}.zip
            dist/koalashot-landing-${{ steps.version.outputs.VERSION }}.zip
            dist/SHA256SUMS
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify draft bytes, manifests and provenance before publication
        run: node scripts/verify-release.mjs --publish
        env:
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
