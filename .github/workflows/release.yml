name: Release KoalaShot

on:
  push:
    tags:
      - 'v*'

# A release run must never be interrupted. It verifies an immutable tag and
# publishes artifacts without modifying source branches.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify immutable source version
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r .version package.json)" = "$VERSION"
          test "$(jq -r .version package-lock.json)" = "$VERSION"
          test "$(jq -r '.packages[""].version' package-lock.json)" = "$VERSION"
          test "$(jq -r .version extension/manifests/chrome.json)" = "$VERSION"
          test "$(jq -r .version extension/manifests/firefox.json)" = "$VERSION"
          test "$(jq -r .version landing/version.json)" = "$VERSION"
          grep -Fq "export const VERSION = \"$VERSION\"" extension/common/constants.js
          echo "Tag $GITHUB_REF_NAME matches every versioned source file."

      - name: Install dependencies
        run: npm ci

      - name: Run full release verification
        run: npm test

      - name: Run target-browser success and denial flows
        run: npm run test:browser:matrix

      - name: Generate extension checksums
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          sha256sum "dist/koalashot-chrome-$VERSION.zip" "dist/koalashot-firefox-$VERSION.zip" > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Generate extension artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/koalashot-*.zip

      - name: Upload landing page artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koalashot-landing-${{ github.ref_name }}
          path: dist/landing/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/koalashot-chrome-${{ steps.version.outputs.VERSION }}.zip
            dist/koalashot-firefox-${{ steps.version.outputs.VERSION }}.zip
            dist/SHA256SUMS
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
