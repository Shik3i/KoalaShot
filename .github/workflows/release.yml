name: Release KoalaShot

on:
  push:
    tags:
      - 'v*'

# The pushed tag is the immutable source of the release. Run
# npm run release:prepare -- X.Y.Z, commit main, and push the annotated tag first.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Validate release tag and source versions
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          for file in package.json extension/manifests/chrome.json extension/manifests/firefox.json landing/version.json; do
            actual=$(jq -r '.version' "$file")
            if [[ "$actual" != "$VERSION" ]]; then
              echo "$file has version $actual, expected $VERSION" >&2
              exit 1
            fi
          done
          grep -Fq "export const VERSION = \"$VERSION\"" extension/common/constants.js
          grep -Fq "Current release: v$VERSION" README.md
          grep -Fq "koalashot-chrome-$VERSION.zip" README.md
          grep -Fq "koalashot-firefox-$VERSION.zip" README.md
          echo "Release source matches $GITHUB_REF_NAME."

      - name: Install dependencies
        run: npm ci

      - name: Run full release verification
        run: npm test

      - name: Generate extension checksums
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.VERSION }}'
          sha256sum "dist/koalashot-chrome-$VERSION.zip" "dist/koalashot-firefox-$VERSION.zip" > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Generate extension artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/koalashot-*.zip

      - name: Upload landing page artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koalashot-landing-${{ github.ref_name }}
          path: dist/landing/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            dist/koalashot-chrome-${{ steps.version.outputs.VERSION }}.zip
            dist/koalashot-firefox-${{ steps.version.outputs.VERSION }}.zip
            dist/SHA256SUMS
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
